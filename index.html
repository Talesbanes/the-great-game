<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great Game · Public League</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#eee9e3;background:#111318;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#803b49;color:#fff;border:1px solid #a45866;border-radius:8px;padding:9px 12px}button:hover{filter:brightness(1.16)}button.secondary{background:#272b33;border-color:#414651}button.danger{background:#512832}input,select,textarea{background:#191c23;color:#eee;border:1px solid #454953;border-radius:7px;padding:9px;width:100%}label{display:block;color:#b7b3b4;font-size:12px;margin-bottom:5px}header{background:#191b21;border-bottom:1px solid #34343c;padding:22px max(20px,calc((100vw - 1250px)/2))}h1{font-family:Georgia,serif;font-size:30px;margin:0;color:#f2e3d9}h2{font-family:Georgia,serif;font-size:22px;margin:0 0 12px}h3{margin:0 0 8px;font-size:16px}p{color:#b8b7ba;line-height:1.55}.subtitle{color:#ba8e95;margin-top:5px}main{max-width:1250px;margin:20px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tabs button.active{background:#914c5a}.panel{background:#1c1f26;border:1px solid #363944;border-radius:12px;padding:18px;margin-bottom:16px}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.muted{color:#aaaab1}.small{font-size:12px}.tag{display:inline-block;border:1px solid #5a5159;border-radius:15px;padding:3px 9px;margin:2px;color:#e3cbd0;font-size:12px}.positive{color:#80c6a0}.negative{color:#ec8b8b}.neutral{color:#c1bdc0}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{padding:10px;border-bottom:1px solid #363943;text-align:left}th{color:#aaaeb7;font-size:12px}tr:hover td{background:#262932}.right{text-align:right}.scroll{overflow-x:auto}.metric{background:#252832;padding:14px;border-radius:9px}.metric strong{display:block;font-size:23px;color:#f2e3d9;margin-top:4px}.event{border-left:3px solid #a05a68;padding:10px 12px;margin:8px 0;background:#24262e;border-radius:0 7px 7px 0}.event p{margin:5px 0 0}.event.win{border-left-color:#4eae79}.event.loss{border-left-color:#d66b72}.result-chip{display:inline-block;padding:3px 8px;margin:3px 5px 2px 0;border-radius:6px;background:#30343b;font-size:12px;font-weight:600}.result-chip.positive{background:#173d2d;color:#a5ebbc}.result-chip.negative{background:#4b242a;color:#ffadb0}.roll-detail{margin-top:7px;border-top:1px solid #41434a;padding-top:7px}.history-controls{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.history-controls>div{flex:1;min-width:190px}.formrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}.hidden{display:none}.note{padding:10px 12px;border-radius:7px;background:#282831;color:#d6c7c8}.event-category{display:inline-flex;align-items:center;border:1px solid #625469;background:#302a38;color:#e9d6f0;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.02em}.event-labels{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pill{padding:3px 8px;border-radius:15px;background:#34303b;color:#e3c7d0;font-size:11px}.footer{color:#888;text-align:center;margin:30px}textarea{min-height:70px}input[type=checkbox]{width:auto}input[type=number]{max-width:110px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.housebtn{background:transparent;border:0;color:#f0c9d0;padding:0;text-align:left}.housebtn:hover{text-decoration:underline}.summary{color:#c8b0b5}.error{color:#ffaaa9}.success{color:#99dfb4}@media(max-width:650px){th,td{padding:7px 5px;font-size:12px}header{padding:16px}h1{font-size:24px}}

.public-note{padding:10px 14px;background:#242832;border-radius:8px;margin-bottom:16px;color:#d8c5ca} .public-footer{color:#929099;text-align:center;padding:30px}</style></head><body><header><h1>THE GREAT GAME <span style="color:#a45b6b">·</span> DARKTON</h1><div class="subtitle">Public league bulletin · Reckoning <span id="cycle"></span></div></header><main><div class="public-note">Published snapshot: <span id="published"></span>. Standings change only when the Game Master publishes a new bulletin.</div><div class="tabs"><button id="standingsBtn" onclick="show('standings')">Standings</button><button id="housesBtn" class="secondary" onclick="show('houses')">Households</button><button id="newsBtn" class="secondary" onclick="show('news')">Developments</button><button id="historyBtn" class="secondary" onclick="show('history')">Past Reckonings</button></div><div id="content"></div><div class="public-footer">The Great Game · Talesbane Empire</div></main><script id="league-snapshot" type="application/json">{"schema":"darkton-public-v1","cycle":1,"publishedAt":"2026-11-02T03:19:38.481Z","houses":[{"id":"h0","name":"House Varkhess","rank":1,"standing":120,"stats":{"Martial":3,"Arcane":1,"Intrigue":2,"Commerce":2,"Exploration":2},"ambition":"Establish its martial academies as the empire’s ultimate standard of excellence.","history":"To the crowds of Darkton, Varkhess produces heroes. Its champions are celebrated in arenas, its instructors are coveted, and its martial academies promise greatness to those who prove worthy. Yet the household’s admiration for strength leaves little sympathy for those who cannot meet its standards.","rivals":[],"services":[]},{"id":"h1","name":"House Blackthorn","rank":2,"standing":110,"stats":{"Martial":3,"Arcane":1,"Intrigue":3,"Commerce":2,"Exploration":1},"ambition":"Restore the authority of ancient noble customs over modern political appointments.","history":"Among the oldest families known to the common folk, Blackthorn is admired for honouring its word and maintaining ancient traditions. A promise from Blackthorn is considered almost sacred. Unfortunately, so is a grievance, and some families have spent generations paying for the mistakes of their ancestors.","rivals":[],"services":[]},{"id":"h2","name":"House Valemont","rank":3,"standing":100,"stats":{"Martial":2,"Arcane":2,"Intrigue":3,"Commerce":3,"Exploration":0},"ambition":"Become the most sought-after intermediary among the great houses and imperial court.","history":"Valemont is the picture of noble perfection: immaculate estates, generous patronage, and impeccable manners. To receive its favour is considered a tremendous honour. Those fortunate enough to enjoy its generosity sometimes discover that the household has a remarkably long memory for favours owed.","rivals":[],"services":[]},{"id":"h3","name":"House Dreadmoor","rank":4,"standing":88,"stats":{"Martial":0,"Arcane":2,"Intrigue":3,"Commerce":0,"Exploration":1},"ambition":"Become the foremost authority on dangerous knowledge and internal threats within its sphere of influence.","history":"Common folk speak of Dreadmoor in lowered voices. Its investigators have a habit of appearing wherever secrets are buried, and people occasionally vanish after attracting their attention. How much of the household’s reputation is true remains uncertain. Dreadmoor has never seemed particularly eager to correct the rumours.","rivals":[],"services":[]},{"id":"h4","name":"House Mournfell","rank":5,"standing":84,"stats":{"Martial":0,"Arcane":3,"Intrigue":1,"Commerce":0,"Exploration":2},"ambition":"Recover lost funerary chronicles and deepen its understanding of Issari, goddess of the dead.","history":"The people know Mournfell for its solemn processions, vast memorial gardens, and reverence for Issari, goddess of the dead. Its scholars study mortality with an intensity that some find comforting and others deeply unsettling. There is something peculiar about immortals who seem so devoted to understanding the one experience they may never share.","rivals":[],"services":[]},{"id":"h5","name":"House Velmora","rank":6,"standing":80,"stats":{"Martial":0,"Arcane":3,"Intrigue":2,"Commerce":1,"Exploration":0},"ambition":"Make Darkton a renowned centre of the arts under Velmoran patronage.","history":"For many mortals, Velmora represents everything beautiful about Darkton. Its theatres, galleries, and lavish performances have elevated unknown artists into celebrated figures. But behind the applause lies a relentless pursuit of perfection, and those who disappoint their patrons seldom receive a second opportunity.","rivals":[],"services":[]},{"id":"h6","name":"House Duvall","rank":7,"standing":76,"stats":{"Martial":0,"Arcane":0,"Intrigue":2,"Commerce":3,"Exploration":0},"ambition":"Expand its discreet financial influence among noble and merchant clients.","history":"Merchants and landowners know Duvall as a discreet source of financing, favourable contracts, and timely assistance. Its representatives are courteous, its terms carefully written, and its patience seemingly endless. Some families still honour agreements signed by ancestors who died a century ago.","rivals":[],"services":[]},{"id":"h7","name":"House Ravencourt","rank":8,"standing":72,"stats":{"Martial":3,"Arcane":1,"Intrigue":2,"Commerce":1,"Exploration":0},"ambition":"Host the most celebrated arenas and tournaments in Darkton.","history":"When Ravencourt announces a spectacle, the streets fill with anticipation. Its magnificent arenas host theatrical duels, elaborate tournaments, and contests featuring celebrated champions from across the nobility. To the crowds, Ravencourt offers glory and entertainment. To the fighters, it offers fame, fortune, and the unsettling knowledge that a disappointing performance can be almost as costly as defeat.","rivals":[],"services":[]},{"id":"h8","name":"House Solvayne","rank":9,"standing":68,"stats":{"Martial":0,"Arcane":3,"Intrigue":0,"Commerce":2,"Exploration":1},"ambition":"Establish a prestigious centre for ambitious magical research and invention.","history":"Solvayne’s wonders are familiar throughout Darkton: enchanted conveniences, extraordinary inventions, and magical demonstrations that seem to defy reason. Its scholars are admired for their brilliance, though residents living near its laboratories occasionally wonder whether the next great discovery will be worth the damage it causes.","rivals":[],"services":[]},{"id":"h9","name":"House Ebonmere","rank":10,"standing":64,"stats":{"Martial":0,"Arcane":2,"Intrigue":0,"Commerce":0,"Exploration":3},"ambition":"Discover a stable passage to the mysterious realm its scholars pursue.","history":"Few commoners can explain what Ebonmere actually studies. Its secluded observatories glow at strange hours, and travellers tell stories of impossible landscapes glimpsed near its estates. The household’s representatives are usually polite, even generous, but their fascination with places beyond the known world makes their intentions difficult to understand.","rivals":[],"services":[]},{"id":"h10","name":"House Silvermark","rank":11,"standing":60,"stats":{"Martial":1,"Arcane":0,"Intrigue":1,"Commerce":3,"Exploration":2},"ambition":"Secure influence over the most profitable trade routes in its region.","history":"Silvermark’s caravans, markets, and merchant ventures are familiar sights across its trading territories. Its investments create opportunities for ambitious mortals, and its representatives proudly reward enterprise. Yet where others see communities and traditions, Silvermark sometimes seems to see only opportunities awaiting development.","rivals":[],"services":[]},{"id":"h11","name":"House Stormholt","rank":12,"standing":56,"stats":{"Martial":3,"Arcane":0,"Intrigue":0,"Commerce":0,"Exploration":3},"ambition":"Lead a legendary expedition into uncharted territory.","history":"Children grow up hearing stories of Stormholt explorers returning with strange treasures and tales of impossible beasts. Its adventurers are admired for their courage and celebrated for pushing beyond familiar borders. Less often repeated are the stories of expeditions that never returned, or the settlements left dealing with what those expeditions disturbed.","rivals":[],"services":[]},{"id":"h12","name":"House Ironvale","rank":13,"standing":52,"stats":{"Martial":2,"Arcane":0,"Intrigue":0,"Commerce":2,"Exploration":0},"ambition":"Build a network of celebrated fortresses and workshops across its holdings.","history":"In territories under Ironvale’s influence, its fortresses, workshops, and formidable engineering projects are symbols of security and prosperity. Its craftsmen are respected for producing work that lasts generations. Those employed within its foundries, however, know that Ironvale values efficiency, discipline, and duty far more readily than comfort.","rivals":[],"services":[]},{"id":"h13","name":"House Holloway","rank":14,"standing":48,"stats":{"Martial":0,"Arcane":1,"Intrigue":2,"Commerce":2,"Exploration":0},"ambition":"Become the most trusted noble patron among mortal communities in its territories.","history":"To many common folk, Holloway appears to be among the most compassionate of the great houses. Its hospitals treat the sick, its foundations support struggling families, and its charitable works ask for surprisingly little in return—often no more than a modest donation of blood. Whether this generosity comes from genuine compassion or shrewd calculation is a question most beneficiaries prefer not to ask.","rivals":[],"services":[]}],"events":[],"history":[]}</script><script>
'use strict';
const snapshot=JSON.parse(document.getElementById('league-snapshot').textContent);
const houses=snapshot.houses||[],events=snapshot.events||[],history=snapshot.history||[];
let tab='standings',selected=houses[0]?.id;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>houses.find(h=>h.id===id),ranked=()=>[...houses].sort((a,b)=>b.standing-a.standing||a.rank-b.rank);
const positions=()=>Object.fromEntries(ranked().map((h,i)=>[h.id,i+1]));
function show(t){tab=t;for(let n of ['standings','houses','news','history'])$(n+'Btn').className=n===t?'':'secondary';render()}
function housePage(id){selected=id;show('houses')}
function render(){let out='',p=positions();if(tab==='standings'){out='<section class="panel"><h2>League Standings</h2><p>Official ranks are settled at a Reckoning. Projected ranks show how the households would place based on current standing.</p><div class="scroll"><table><thead><tr><th>Official rank</th><th>Household</th><th class="right">Standing</th><th class="right">Projected</th><th class="right">Movement</th></tr></thead><tbody>'+[...houses].sort((a,b)=>a.rank-b.rank).map(h=>{let d=h.rank-p[h.id];return `<tr><td><b>#${h.rank}</b></td><td><button class="housebtn" onclick="housePage('${h.id}')">${esc(h.name)}</button></td><td class="right">${h.standing}</td><td class="right">#${p[h.id]}</td><td class="right ${d>0?'positive':d<0?'negative':'neutral'}">${d>0?'▲ '+d:d<0?'▼ '+Math.abs(d):'—'}</td></tr>`}).join('')+'</tbody></table></div></section>'}
if(tab==='houses'){let h=byId(selected)||houses[0];out=h?`<section class="panel"><div class="flex between"><h2>Household Dossiers</h2><select style="max-width:320px" onchange="selected=this.value;render()">${houses.map(x=>`<option value="${x.id}" ${x.id===h.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="grid"><div class="metric">Official rank<strong>#${h.rank}</strong></div><div class="metric">Standing<strong>${h.standing}</strong></div><div class="metric">Projected rank<strong>#${p[h.id]}</strong></div></div></section><section class="panel"><h2>${esc(h.name)}</h2><p>${esc(h.history)}</p><p><b>Ambition:</b> ${esc(h.ambition)}</p><p><b>Specialities:</b> ${Object.entries(h.stats||{}).map(([k,v])=>esc(k)+' '+Number(v)).join(' · ')}</p><p><b>Recognised rivals:</b> ${(h.rivals||[]).map(id=>esc(byId(id)?.name||'Unknown')).join(', ')||'None'}</p>${(h.services||[]).length?`<p><b>Services:</b> ${h.services.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</p>`:''}</section>`:''}
if(tab==='news'){out='<section class="panel"><h2>Recent Developments</h2>'+ (events.length?events.slice(0,40).map(e=>`<div class="event"><div class="flex between"><b>${esc(e.title)}</b><span class="pill">${esc(e.kind||'Event')}</span></div><p>${esc(e.detail||'')}</p><div class="small">${(e.deltas||[]).map(d=>`<span class="result-chip ${d.amount>0?'positive':d.amount<0?'negative':'neutral'}">${esc(byId(d.id)?.name||'Household')} ${d.amount>=0?'+':''}${d.amount}</span>`).join('')}</div></div>`).join(''):'<p>No public developments yet.</p>')+'</section>'}
if(tab==='history'){out='<section class="panel"><h2>Past Reckonings</h2>'+(history.length?history.map(r=>`<div class="event"><h3>Reckoning ${r.cycle}</h3>${(r.after||[]).slice().sort((a,b)=>a.rank-b.rank).map(h=>{let prev=(r.before||[]).find(x=>x.id===h.id);return `<div class="flex between" style="padding:5px 0;border-bottom:1px solid #383b44"><span>#${h.rank} ${esc(h.name)}</span><span class="small muted">Previously #${prev?.rank??'?'}</span></div>`}).join('')}</div>`).join(''):'<p>No completed Reckonings yet.</p>')+'</section>'}
$('content').innerHTML=out}
$('cycle').textContent=snapshot.cycle; $('published').textContent=snapshot.publishedAt?new Date(snapshot.publishedAt).toLocaleString('en-GB'):'Not dated';render();
</script></body></html>
